services:
  mystery-engine:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      SESSION_BACKEND: sqlite
      SESSION_DB_PATH: /app/data/sessions/mystery_sessions.db
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
      LOG_FORMAT: json
    volumes:
      - mystery_sessions:/app/data/sessions
    depends_on:
      - jaeger

  mystery-engine-a2a:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "mystery_engine.a2a_server"]
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      A2A_PORT: "8001"
      OTEL_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62
    ports:
      - "16686:16686" # Jaeger Trace UI -> http://localhost:16686
      - "4318:4318"   # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  mystery_sessions:
