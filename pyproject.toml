[project]
name = "mystery-engine-adk"
version = "0.1.0"
description = "Interactive AI Mystery Engine built with Google ADK for the AI in 5 Days L200 Freestyle Track"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=1.14.0",
    "google-genai>=1.20.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0",
    "mcp>=1.6.0",
    "uvicorn>=0.32.0",
    "fastapi>=0.115.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[project.optional-dependencies]
a2a = [
    "a2a-sdk>=0.3.0",
]
cloud = [
    "google-cloud-aiplatform[adk,agent_engines]>=1.95.0",
    "opentelemetry-exporter-gcp-trace>=1.9.0",
]
eval = [
    "google-adk[eval]>=1.14.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mystery_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "eval: live ADK AgentEvaluator tests requiring GOOGLE_API_KEY",
    "integration: integration tests exercising subprocesses or external backends",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
